name: Verificaciones

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La prueba de layout necesita el servidor corriendo y se salta sola.
      - name: Pruebas
        run: npm test
      # El build va antes de tsc: genera next-env.d.ts (está en .gitignore), que
      # trae las declaraciones de imágenes (*.svg, *.png). Sin él, tsc no
      # encuentra los imports de imágenes en un checkout limpio.
      - name: Build de producción
        run: npm run build
      - name: Tipos
        run: npx tsc --noEmit
